<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACE - AI Interview Prep</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'brand': {
                'primary': '#4f46e5',
                'secondary': '#7c3aed',
                'light': '#6366f1',
                'dark': '#3730a3',
              },
              'background': {
                'dark': '#111827',
                'medium': '#1f2937',
                'light': '#374151',
              },
              'text': {
                'primary': '#f9fafb',
                'secondary': '#d1d5db',
                'muted': '#9ca3af',
              }
            },
            typography: ({ theme }) => ({
              invert: {
                css: {
                  '--tw-prose-body': theme('colors.text.secondary'),
                  '--tw-prose-headings': theme('colors.text.primary'),
                  '--tw-prose-links': theme('colors.brand.light'),
                  '--tw-prose-bold': theme('colors.text.primary'),
                  '--tw-prose-hr': theme('colors.background.light'),
                  '--tw-prose-quotes': theme('colors.text.primary'),
                  '--tw-prose-quote-borders': theme('colors.brand.dark'),
                  '--tw-prose-code': theme('colors.text.primary'),
                  '--tw-prose-pre-code': theme('colors.text.secondary'),
                  '--tw-prose-pre-bg': theme('colors.background.dark'),
                },
              },
            }),
          },
        },
      }
    </script>
    <style>
      /* Inline code (including converted complexity like O(n log n)): no literal backticks, subtle chip. */
      .prose :not(pre) > code::before,
      .prose :not(pre) > code::after { content: none; }
      .prose :not(pre) > code {
        background: #111827;
        padding: 0.1rem 0.35rem;
        border-radius: 0.25rem;
        font-size: 0.9em;
        font-weight: 600;
      }
    </style>
</head>
  <body class="bg-background-dark">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
